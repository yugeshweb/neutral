[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-health"
version = "0.1.0"
description = "Hardware-aware hybrid quantum/classical disease-detection benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "qiskit~=2.5.1",
  "qiskit-aer~=0.17.1",
  "qiskit-machine-learning~=0.9.1",
  "qiskit-algorithms~=0.4.0",
  # qhealth_qml.ingest: standardizer format adapters beyond CSV.
  "pydicom>=2.4,<4",       # DICOM header tags AND (pipeline.adapters.dicom_series) pixel data
  "pypdf>=4.0,<6",         # PDF native text-layer extraction
  "pymupdf>=1.24,<2",      # pure-Python PDF page rasterization for OCR (no poppler)
  "pytesseract>=0.3,<1",   # OCR wrapper - still needs the Tesseract engine on PATH
  # qhealth_qml.pipeline: Phase 2 (signal) / Phase 3 (imaging) adapters.
  "nibabel>=5.2,<6",       # pipeline.adapters.nifti_volume
  "wfdb>=4.3,<5",          # pipeline.adapters.wfdb_ecg - pin from origin/main kept as-is
  "mne>=1.7,<2",           # pipeline.adapters.edf_eeg - EDF reader (pyedflib needs a C compiler this machine lacks)
  "Pillow>=10.0,<12",      # pipeline.adapters.image_2d - plain PNG/JPEG, not part of the team-head spec
]

[project.optional-dependencies]
hardware = ["qiskit-ibm-runtime~=0.47.0"]

[project.scripts]
qhealth = "qhealth_qml.cli:main"
qhealth-study = "qhealth_qml.study_cli:main"
qhealth-dashboard = "qhealth_qml.dashboard:main"
qhealth-cardiovascular = "qhealth_qml.cardiovascular_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qhealth_qml = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
